<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Table QR codes — Anchor &amp; Batter</title>
    <link rel="stylesheet" href="{{STAFF_BASE}}/assets/staff.css" />
  </head>
  <body data-staff-base="{{STAFF_BASE}}" data-staff-view="qr">
    <p id="error" class="error" hidden></p>

    <main>
      <form id="qr-form" class="controls">
        <div class="field">
          <label for="tables">Tables</label>
          <!-- Free text rather than a number picker: a dining room is "1-12,
               PATIO-1, BAR", and no stepper expresses that. -->
          <input id="tables" name="tables" type="text" value="1-12" autocapitalize="characters" spellcheck="false" />
          <span class="hint">Ranges and labels: <code>1-12</code>, <code>1-8,PATIO-1</code></span>
        </div>
        <button id="generate" class="advance" type="submit">Generate codes</button>
        <div class="presets">
          <button type="button" id="print" hidden>Print sheet</button>
        </div>
      </form>

      <p id="hint" class="empty">
        Each code opens the menu for that table. Scanning always starts a fresh order, so the
        previous diner's cart never carries over.
      </p>

      <div id="codes" class="qr-sheet"></div>
    </main>

    <script type="module">
      import { api, el, errorBanner } from "{{STAFF_BASE}}/assets/common.js";
      import { mountStaffChrome } from "{{STAFF_BASE}}/assets/nav.js";

      const { slot } = mountStaffChrome({ title: "Table QR codes" });
      const count = el("span", { class: "card-count", text: "" });
      slot.append(count);

      const showError = errorBanner();
      const form = document.getElementById("qr-form");
      const tablesInput = document.getElementById("tables");
      const generate = document.getElementById("generate");
      const printButton = document.getElementById("print");
      const sheet = document.getElementById("codes");
      const hint = document.getElementById("hint");

      function card({ table, url, png }) {
        return el("figure", { class: "qr-card" }, [
          el("img", { src: png, alt: `QR code for table ${table}`, loading: "lazy" }),
          el("figcaption", {}, [
            el("strong", { text: `Table ${table}` }),
            el("span", { class: "qr-url", text: url }),
          ]),
          // The browser saves the data URI straight to disk — no round trip, and
          // nothing for the server to keep a copy of.
          el("a", {
            class: "qr-download",
            href: png,
            download: `table-${table}.png`,
            text: "Download PNG",
          }),
        ]);
      }

      async function generateCodes(event) {
        event?.preventDefault();
        const spec = tablesInput.value.trim();

        showError();
        generate.disabled = true;
        generate.textContent = "Generating…";

        try {
          const { codes } = await api(`/api/staff/qr-codes?tables=${encodeURIComponent(spec)}`);
          sheet.replaceChildren(...codes.map(card));
          count.textContent = `${codes.length} code${codes.length === 1 ? "" : "s"}`;
          printButton.hidden = codes.length === 0;
          hint.hidden = true;
        } catch (error) {
          showError(error.message);
          sheet.replaceChildren();
          count.textContent = "";
          printButton.hidden = true;
        } finally {
          generate.disabled = false;
          generate.textContent = "Generate codes";
        }
      }

      // Prints this page. The stylesheet hides everything but the cards, so what
      // comes out of the printer is the stickers and nothing else.
      printButton.addEventListener("click", () => window.print());
      form.addEventListener("submit", generateCodes);

      // The default dining room, on screen the moment the page opens: the common
      // case is "print the ones I already have", not "type a range first".
      void generateCodes();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sign in — Anchor &amp; Batter</title>
    <link rel="stylesheet" href="{{STAFF_BASE}}/assets/staff.css" />
    <script>
      // Applied before first paint, so a stored choice never flashes the other
      // way round. Deliberately inline: a module would be deferred. Key must
      // match THEME_KEY in theme.js.
      try {
        var t = localStorage.getItem("ab-theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body class="login-page" data-staff-base="{{STAFF_BASE}}" data-staff-view="login">
    <main>
      <form id="login-form" class="login-card" novalidate>
        <h1>Staff sign in</h1>
        <p class="sub">Your own staff ID and password. Ask an Owner if you do not have one yet.</p>

        <div class="field">
          <label for="staff-id">Staff ID</label>
          <!--
            autofocus so a tablet on the pass is one tap from typing. The code is
            short and uppercase, so the keyboard is told as much.
          -->
          <input
            id="staff-id"
            name="staffId"
            type="text"
            autocomplete="username"
            autocapitalize="characters"
            spellcheck="false"
            maxlength="12"
            placeholder="e.g. AR47"
            required
            autofocus
          />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            autocapitalize="off"
            spellcheck="false"
            required
          />
        </div>

        <p id="form-error" class="form-error" hidden></p>

        <button id="submit" class="advance" type="submit">Sign in</button>

        <!--
          The shared-password door. Hidden unless the server says it is genuinely
          usable, which is only before this shop has an Owner or when somebody has
          deliberately reopened it — otherwise it is a second front door advertised
          on the front door.
        -->
        <p id="bootstrap" class="login-alt" hidden>
          No Owner account exists yet.
          <a id="bootstrap-link" href="{{STAFF_BASE}}/login/emergency">Set one up with the shop password</a>.
        </p>
      </form>

      <!-- Signing in is not a prerequisite for being able to read the screen. -->
      <div id="theme-slot" class="theme-slot"></div>
    </main>

    <script type="module">
      import { homePathFor } from "{{STAFF_BASE}}/assets/nav.js";
      import { mountThemeToggle } from "/theme.js";

      mountThemeToggle(document.getElementById("theme-slot"), { label: "Switch between light and dark" });

      const form = document.getElementById("login-form");
      const staffId = document.getElementById("staff-id");
      const password = document.getElementById("password");
      const submit = document.getElementById("submit");
      const error = document.getElementById("form-error");
      const bootstrap = document.getElementById("bootstrap");

      /**
       * Where to go once signed in.
       *
       * `?next=` is set by the server when it turns a staff page away, so a
       * bookmarked Sales Report comes back to the Sales Report. Only same-site
       * paths are honoured — an absolute URL in a query parameter is an open
       * redirect, and this page is exactly the sort a phisher would like one on.
       */
      function destination(sections) {
        const next = new URLSearchParams(location.search).get("next");
        if (next && next.startsWith("/") && !next.startsWith("//")) return next;
        // Not always the dashboard: it is a section like any other, and landing
        // somebody on a page their role forbids is a 403 for signing in
        // correctly.
        return homePathFor(sections);
      }

      /**
       * Puts the form beyond use and says why.
       *
       * For the one case the form cannot answer: the server has nothing
       * configured, so there is no value anyone could type that would work.
       * Leaving a live field there would have someone trying passwords against a
       * door with no lock fitted.
       */
      function showUnconfigured() {
        staffId.disabled = true;
        password.disabled = true;
        submit.disabled = true;
        showError(
          "The staff area is closed because no password has been configured on the server. " +
            "Set STAFF_PASSWORD and redeploy — until then nobody can sign in.",
        );
      }

      // Already signed in — a tablet that woke up on this page should not make
      // anyone type a password they have already typed.
      fetch("/api/staff/session")
        .then((response) => response.json())
        .then((session) => {
          if (session.authenticated || session.authRequired === false) {
            location.replace(destination(session.sections));
            return;
          }
          if (session.configured === false) {
            showUnconfigured();
            return;
          }
          // Offered only while it is the one way in.
          bootstrap.hidden = session.bootstrapAvailable !== true;
        })
        .catch(() => {
          // Offline or the server is down. The form still works; let them try.
        });

      function showError(message) {
        error.textContent = message ?? "";
        error.hidden = !message;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        showError();
        submit.disabled = true;

        try {
          const response = await fetch("/api/staff/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ staffId: staffId.value.trim(), password: password.value }),
          });
          const body = await response.json().catch(() => ({}));

          if (response.ok) {
            // replace, not assign: the back button should not return to a login
            // screen that has already done its job.
            location.replace(destination(body.sections));
            return;
          }

          if (response.status === 503 && body.error === "staff_auth_unconfigured") {
            showUnconfigured();
            return;
          }

          showError(body.message ?? `Sign in failed (${response.status})`);
          password.select();
        } catch (failure) {
          showError(failure.message ?? "Could not reach the server.");
        } finally {
          // Not unconditionally: an unconfigured server disables the fields on
          // purpose, and re-enabling here would hand back a form that cannot work.
          if (!password.disabled) submit.disabled = false;
        }
      });
    </script>
  </body>
</html>

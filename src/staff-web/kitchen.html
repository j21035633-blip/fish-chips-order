<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Kitchen &amp; counter — Anchor &amp; Batter</title>
    <link rel="stylesheet" href="{{STAFF_BASE}}/assets/staff.css" />
    <script>
      // Applied before first paint, so a stored choice never flashes the other
      // way round. Deliberately inline: a module would be deferred. Key must
      // match THEME_KEY in theme.js.
      try {
        var t = localStorage.getItem("ab-theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body data-staff-base="{{STAFF_BASE}}" data-staff-view="kitchen">
    <p id="error" class="error" hidden></p>

    <main>
      <section class="live-orders">
        <h2 class="section-head">Live orders</h2>
        <div id="cards" class="cards"></div>
        <p id="empty" class="empty" hidden>Nothing on the pass.</p>
      </section>

      <!--
        Quick add, always on screen. A walk-in is the busiest thing that happens
        at this counter, so it is not behind a button: the categories are there
        the moment the page is, and the whole order is two taps deep.
      -->
      <section class="quick-add">
        <div class="section-head-row">
          <h2 class="section-head">Quick add (take away)</h2>
          <span id="quick-hint" class="card-count">Tap a section, then an item</span>
        </div>

        <div class="quick-add-body">
          <div>
            <div id="categories" class="cat-tiles"><p class="empty">Loading the menu…</p></div>
            <!-- The tapped category's items, opened in place under the tiles
                 rather than in a dialog: the running order stays on screen. -->
            <div id="cat-items" class="cat-items" hidden></div>
          </div>

          <aside class="walkin">
            <h3>This order</h3>
            <div id="walkin-lines"><p class="empty">Nothing added yet.</p></div>
            <div id="walkin-totals" class="totals" hidden>
              <div class="totals-row"><span>Subtotal</span><span id="walkin-subtotal">RM0.00</span></div>
              <div class="totals-row"><span id="walkin-tax-label">Tax</span><span id="walkin-tax">RM0.00</span></div>
              <div class="totals-row grand"><span>Total</span><strong id="walkin-total">RM0.00</strong></div>
            </div>
            <p id="walkin-error" class="form-error" hidden></p>

            <div class="walkin-actions">
              <button id="create-order" class="advance" type="button" disabled>Create order</button>
              <button id="clear-order" class="undo" type="button" hidden>Clear</button>
            </div>
            <p id="walkin-note" class="hint" hidden></p>
          </aside>
        </div>
      </section>
    </main>

    <!--
      How it was paid, asked only once there is an order to pay for. Cash and
      card are the two paths the backend already knows: one settles here, the
      other waits on the Stripe webhook.
    -->
    <dialog id="pay" class="pay-dialog" aria-label="Payment method">
      <div class="sheet-head">
        <h2 id="pay-title">How is it being paid?</h2>
        <button id="pay-close" class="icon-button" type="button" aria-label="Cancel">&times;</button>
      </div>
      <div class="pay-body">
        <p id="pay-total" class="pay-total">RM0.00</p>
        <!--
          Who is ringing it up, asked here rather than in a second sheet: this
          dialog is already the step between "there is an order" and "money has
          moved", and it sits outside the polled board, so what is typed into it
          is not rebuilt underneath the person typing.
        -->
        <div class="pay-staff">
          <label class="field" for="pay-staff-id">
            <span>Staff ID</span>
            <input id="pay-staff-id" class="attribution-input" type="text" autocomplete="off"
                   autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="e.g. AR47" />
          </label>
          <label class="field" for="pay-staff-name">
            <span>Name</span>
            <input id="pay-staff-name" class="attribution-input" type="text" autocomplete="off"
                   maxlength="60" placeholder="Full name" />
          </label>
        </div>
        <p id="pay-error" class="form-error" hidden></p>
        <button id="pay-cash" class="advance wide" type="button">Cash — paid now</button>
        <button id="pay-card" class="ghost wide" type="button">Card — Stripe</button>
      </div>
    </dialog>

    <!-- The options sheet, same markup as the customer page's. -->
    <dialog id="opts" class="opts-dialog" aria-label="Item options">
      <div class="sheet-head">
        <h2 id="opts-title"></h2>
        <button id="opts-close" class="icon-button" type="button" aria-label="Close">&times;</button>
      </div>
      <div id="opts-body" class="opts-body"></div>
      <div class="opts-foot">
        <div class="qty">
          <button type="button" class="icon-button" data-qty="-1" aria-label="Fewer">&minus;</button>
          <output id="opts-qty">1</output>
          <button type="button" class="icon-button" data-qty="1" aria-label="More">+</button>
        </div>
        <button id="opts-add" class="advance" type="button">Add — <span id="opts-price"></span></button>
      </div>
    </dialog>

    <script type="module">
      import {
        api,
        cancelActions,
        cancelFlag,
        el,
        owesAtCounter,
        settleActions,
        staffCancel,
        unpaidTag,
        errorBanner,
        orderFeed,
        orderLabel,
        takeawayTag,
      } from "{{STAFF_BASE}}/assets/common.js";
      import { askStaff, processedByLine } from "{{STAFF_BASE}}/assets/attribution.js";
      import { mountStaffChrome } from "{{STAFF_BASE}}/assets/nav.js";
      import { onDutyWidget } from "{{STAFF_BASE}}/assets/onDuty.js";
      // The customer app's own menu UI. Public because it is menu rendering, the
      // same code /app.js already serves — see the note at the top of that file.
      import { formatSen, itemDetails, optionGroup, pricedSelection, selectedChoices }
        from "/menu-browse.js";

      // One card per order still on the pass, each showing the single action its
      // status calls for. Ordered so the oldest ticket is the first one a cook
      // sees, which is the opposite of the dashboard's newest-first feed.
      const ACTIVE = ["received", "cooking", "ready"];
      const ACTION = {
        received: { next: "cooking", label: "Start Cooking" },
        cooking: { next: "ready", label: "Mark Ready" },
        ready: { next: "collected", label: "Mark Collected" },
      };
      const STATUS_NAME = { received: "Received", cooking: "Cooking", ready: "Ready" };

      const { slot } = mountStaffChrome({ title: "Kitchen & Counter" });
      const feedState = el("span", { id: "feed-state", class: "feed-state", text: "connecting…" });
      const count = el("span", { class: "card-count", text: "—" });
      // Beside the live indicator, because both answer "what is the state of
      // this tablet right now" — and neither gates anything.
      const onDuty = onDutyWidget();
      slot.append(onDuty.node, feedState, count);

      const cardsEl = document.getElementById("cards");
      const emptyEl = document.getElementById("empty");
      const showError = errorBanner();
      const busy = new Set();

      /**
       * Which tickets are currently asking "are you sure".
       *
       * Held out here, beside `busy`, because the board repaints from the feed
       * every two seconds — a confirm kept inside the card would be wiped
       * mid-question, and the second tap would land on a fresh Cancel button.
       */
      const arming = new Set();
      /** The last feed payload, so arming can repaint without a round trip. */
      let latest = null;
      const redraw = () => {
        if (latest) draw(latest);
      };

      /**
       * Cancel an order from the counter, refund included.
       *
       * The same server-side path the customer's own request goes through when
       * it is approved, so the money is handled identically — and what it says
       * about the money is surfaced, because for cash and e-wallet orders the
       * honest answer is "somebody has to do this by hand".
       */
      async function cancelOrder(orderId) {
        busy.add(orderId);
        try {
          const { refund } = await api(`/api/staff/orders/${orderId}/cancel`, { method: "PATCH" });
          arming.delete(orderId);
          if (refund?.reason) showError(refund.reason);
          await feed.refresh();
        } catch (error) {
          showError(error.message);
        } finally {
          busy.delete(orderId);
        }
      }

      /** The Cancel control for one ticket, wired to the set above. */
      function cancelControl(order) {
        return staffCancel({
          armed: arming.has(order.id),
          busy: busy.has(order.id),
          onArm: () => {
            arming.add(order.id);
            redraw();
          },
          onDismiss: () => {
            arming.delete(order.id);
            redraw();
          },
          onConfirm: () => cancelOrder(order.id),
        });
      }


      function card(order) {
        const action = ACTION[order.kitchenStatus];
        const wantsCancel = order.cancellationRequested === true;
        const paid = order.paymentStatus === "paid";

        const label = orderLabel(order);

        return el("article", { class: `card ${order.kitchenStatus}${wantsCancel ? " wants-cancel" : ""}` }, [
          wantsCancel ? el("div", { style: "margin-bottom:8px" }, [cancelFlag()]) : null,
          el("div", { class: "ticket-head" }, [
            el("span", {}, [
              el("span", { class: label.takeaway ? "table takeaway" : "table", text: label.text }),
              label.takeaway ? takeawayTag() : null,
            ]),
            el("span", { class: "reference", text: order.reference }),
          ]),
          order.customerName ? el("div", { class: "opts", text: order.customerName }) : null,
          el(
            "ul",
            { class: "lines" },
            order.lines.map((line) =>
              el("li", {}, [
                el("span", {}, [
                  el("span", { text: `${line.quantity}× ${line.name}` }),
                  line.options?.length
                    ? el("div", { class: "opts", text: line.options.map((o) => o.choiceName).join(", ") })
                    : null,
                  line.note ? el("div", { class: "opts", text: `Note: ${line.note}` }) : null,
                ]),
                el("span", { text: line.lineTotal }),
              ]),
            ),
          ),
          // Who took the money, on both boards, for as long as the order shows.
          processedByLine(order),
          el("div", { class: "status-line" }, [
            el("span", { class: "status-name", text: STATUS_NAME[order.kitchenStatus] }),
            el("span", { class: "total", text: order.total }),
            owesAtCounter(order)
              ? unpaidTag()
              : el("span", { class: `tag ${order.paymentStatus}`, text: paid ? "Paid" : order.paymentStatus }),
          ]),
          el("div", { class: "card-actions" }, [
            el("button", {
              class: "advance",
              type: "button",
              text: action.label,
              disabled: busy.has(order.id),
              onClick: () => move(order.id, action.next),
            }),
            arming.has(order.id) ? null : cancelControl(order),
          ]),
          arming.has(order.id) ? cancelControl(order) : null,
          // Below the one action the status calls for, so a decision about
          // cancelling cannot be mistaken for it during service.
          wantsCancel ? cancelActions(order, (choice) => decide(order.id, choice), busy.has(order.id)) : null,
          // Last, because taking money is the ordinary case and cancelling is
          // the exception — and the two must never sit next to each other.
          owesAtCounter(order)
            ? settleActions(order, (how) => settle(order, how), busy.has(order.id))
            : null,
        ]);
      }

      /** How the sheet names the money it is about to take. */
      const SETTLE_LABEL = { cash: "cash", card: "card", ewallet: "e-wallet" };

      /**
       * Take the money for an order the customer left owing at the counter.
       *
       * Who is taking it is asked first, and the pair they type goes with the
       * request: the endpoint refuses an unattributed settlement, so this is not
       * a check the page could skip. A rejected pair is reported inside the
       * sheet, which is where whoever typed it is looking.
       *
       * Cash comes back settled. Card and e-wallet come back with a link or a
       * QR to turn round to the customer, and the order stays unpaid until the
       * provider's webhook says otherwise — so what is shown says which of the
       * two just happened, rather than claiming the money is in. That note waits
       * until the sheet is closed; a banner behind a modal is a banner nobody
       * reads.
       */
      async function settle(order, method) {
        let note = null;

        const done = await askStaff({
          title: `Take ${order.total} — ${SETTLE_LABEL[method]}`,
          detail: `Order ${order.reference}. Who is taking this payment?`,
          onConfirm: async ({ staffId, staffName }) => {
            busy.add(order.id);
            try {
              const { settled, payment } = await api(`/api/staff/orders/${order.id}/settle`, {
                method: "PATCH",
                body: JSON.stringify({ method, staffId, staffName }),
              });
              if (!settled) {
                const where = payment?.checkoutUrl ?? payment?.qrCodeUrl;
                note = where
                  ? `Show the customer: ${where} — the order stays unpaid until they pay.`
                  : "Payment started. The order stays unpaid until it confirms.";
              }
            } finally {
              busy.delete(order.id);
            }
          },
        });

        if (!done) return;
        if (note) showError(note);
        await feed.refresh();
      }

      /**
       * Approve or deny, then redraw from the server.
       *
       * The refund happens server-side inside the approval, so nothing here
       * has to remember it. What it reports about the money is surfaced rather
       * than assumed: for a cash or e-wallet order the honest answer is
       * "somebody has to do this by hand", and that has to reach the counter.
       */
      async function decide(orderId, choice) {
        busy.add(orderId);
        try {
          const { refund } = await api(`/api/staff/orders/${orderId}/${choice}`, { method: 'PATCH' });
          if (refund?.reason) showError(refund.reason);
          await feed.refresh();
        } catch (error) {
          showError(error.message);
        } finally {
          busy.delete(orderId);
        }
      }

      async function move(orderId, status) {
        busy.add(orderId);
        try {
          await api(`/api/staff/orders/${orderId}/status`, {
            method: "PATCH",
            body: JSON.stringify({ status }),
          });
          // Redraw from the server rather than locally: the same order may have
          // been moved on another tablet a second ago, and the feed is the truth.
          await feed.refresh();
        } catch (error) {
          showError(error.message);
        } finally {
          busy.delete(orderId);
        }
      }

      function draw({ orders }) {
        latest = { orders };
        showError();
        const active = orders
          .filter((order) => ACTIVE.includes(order.kitchenStatus))
          .sort((left, right) => left.createdAt.localeCompare(right.createdAt));

        count.textContent = `${active.length} on the pass`;
        cardsEl.replaceChildren(...active.map(card));
        emptyEl.hidden = active.length > 0;
      }

      // --------------------------------------------------- quick add (walk-in)
      //
      // Built on the customer's own cart endpoints — POST /api/carts, then
      // /api/carts/:id/lines — so pricing, options, tax and validation are the
      // same code path a QR order takes. Only the last step differs, and that is
      // the one staff route: /api/staff/orders/takeaway.

      const categoriesEl = document.getElementById("categories");
      const catItemsEl = document.getElementById("cat-items");
      const walkinLines = document.getElementById("walkin-lines");
      const walkinTotals = document.getElementById("walkin-totals");
      const walkinNote = document.getElementById("walkin-note");
      const walkinError = document.getElementById("walkin-error");
      const createOrder = document.getElementById("create-order");
      const clearOrder = document.getElementById("clear-order");
      const optsDialog = document.getElementById("opts");
      const optsBody = document.getElementById("opts-body");
      const payDialog = document.getElementById("pay");

      const walkin = { cartId: null, cart: null, menu: [], openCategory: null, item: null, qty: 1 };

      function showWalkinError(message) {
        walkinError.textContent = message ?? "";
        walkinError.hidden = !message;
      }

      /**
       * A category's tile picture.
       *
       * Categories carry no image of their own — only items do, uploaded on the
       * Menu page — so a section wears the first photo among its items. That is
       * a real photo of the food in that section rather than an icon, and it
       * follows the menu: change the picture on the Menu page and this follows.
       */
      function categoryImage(category) {
        return category.items.find((item) => item.imageUrl)?.imageUrl;
      }

      function categoryTile(category) {
        const image = categoryImage(category);
        const open = walkin.openCategory === category.id;

        return el(
          "button",
          {
            class: `cat-tile${open ? " open" : ""}`,
            type: "button",
            "aria-expanded": open ? "true" : "false",
            onClick: () => toggleCategory(category.id),
          },
          [
            image
              ? el("img", { class: "cat-thumb", src: image, alt: "", loading: "lazy" })
              // No photo uploaded in this section yet. A neutral panel rather
              // than an emoji, which would be the one thing this must not be.
              : el("div", { class: "cat-thumb cat-thumb-blank", "aria-hidden": "true" }),
            el("span", { class: "cat-name", text: category.name }),
            el("span", { class: "cat-count", text: `${category.items.length} items` }),
          ],
        );
      }

      /** One item in an opened section: picture, name, price. */
      function itemTile(item) {
        const sellable = item.available !== false;

        return el(
          "button",
          {
            class: "quick-item",
            type: "button",
            "aria-disabled": sellable ? undefined : "true",
            onClick: () => sellable && pickItem(item),
          },
          [
            item.imageUrl
              ? el("img", { class: "quick-thumb", src: item.imageUrl, alt: "", loading: "lazy" })
              : el("div", { class: "quick-thumb cat-thumb-blank", "aria-hidden": "true" }),
            el("span", { class: "quick-name", text: item.name }),
            sellable
              ? el("span", { class: "quick-price", text: item.price })
              : el("span", { class: "quick-price sold-out", text: "Sold out" }),
          ],
        );
      }

      function toggleCategory(categoryId) {
        walkin.openCategory = walkin.openCategory === categoryId ? null : categoryId;
        drawCategories();
      }

      function drawCategories() {
        categoriesEl.replaceChildren(...walkin.menu.map(categoryTile));

        const open = walkin.menu.find((category) => category.id === walkin.openCategory);
        catItemsEl.hidden = open === undefined;
        if (open) catItemsEl.replaceChildren(...open.items.map(itemTile));
      }

      /**
       * Straight in if there is nothing to choose, and through the options sheet
       * if there is — the same sheet, and the same option groups, the customer
       * sees. A drink with an ice level asks; a side with no options does not.
       */
      function pickItem(item) {
        if (item.optionGroups.length === 0) {
          void addLine(item, 1, []);
          return;
        }

        walkin.item = item;
        walkin.qty = 1;
        document.getElementById("opts-title").textContent = item.name;
        document.getElementById("opts-qty").textContent = "1";
        optsBody.replaceChildren(
          ...itemDetails(item),
          ...item.optionGroups.map((group) => optionGroup(group, priceOptions)),
        );
        priceOptions();
        optsDialog.showModal();
      }

      function priceOptions() {
        if (!walkin.item) return;
        document.getElementById("opts-price").textContent =
          formatSen(pricedSelection(walkin.item, optsBody, walkin.qty));
      }

      /** Opens the walk-in cart on first use; there is no cart until something is added. */
      async function addLine(item, quantity, selections) {
        showWalkinError();
        try {
          if (!walkin.cartId) {
            const { cartId } = await api("/api/carts", { method: "POST", body: JSON.stringify({}) });
            walkin.cartId = cartId;
          }
          await api(`/api/carts/${walkin.cartId}/lines`, {
            method: "POST",
            body: JSON.stringify({ itemId: item.id, quantity, selections }),
          });
          await refreshWalkin();
        } catch (error) {
          showWalkinError(error.message);
        }
      }

      async function refreshWalkin() {
        if (!walkin.cartId) return resetWalkin();

        const { cart } = await api(`/api/carts/${walkin.cartId}`);
        walkin.cart = cart;

        const lines = cart.lines ?? [];
        walkinTotals.hidden = lines.length === 0;
        createOrder.disabled = lines.length === 0;
        clearOrder.hidden = lines.length === 0;

        document.getElementById("walkin-subtotal").textContent = cart.subtotal;
        document.getElementById("walkin-tax").textContent = cart.tax;
        document.getElementById("walkin-tax-label").textContent =
          cart.taxRate === undefined ? "Tax" : `Tax (${Number((cart.taxRate * 100).toFixed(2))}%)`;
        document.getElementById("walkin-total").textContent = cart.total;

        walkinLines.replaceChildren(
          lines.length === 0
            ? el("p", { class: "empty", text: "Nothing added yet." })
            : el(
                "div",
                {},
                lines.map((line) =>
                  el("div", { class: "cart-line" }, [
                    el("div", { class: "cart-line-main" }, [
                      el("div", { class: "cart-line-name", text: `${line.quantity}× ${line.name}` }),
                      line.options.length > 0
                        ? el("div", { class: "opts", text: line.options.map((o) => o.choiceName).join(", ") })
                        : null,
                    ]),
                    el("span", { class: "cart-line-total", text: line.lineTotal }),
                    el("button", {
                      class: "undo",
                      type: "button",
                      text: "Remove",
                      onClick: () => removeLine(line.lineId),
                    }),
                  ]),
                ),
              ),
        );
      }

      function resetWalkin() {
        walkin.cartId = null;
        walkin.cart = null;
        walkinTotals.hidden = true;
        createOrder.disabled = true;
        clearOrder.hidden = true;
        walkinLines.replaceChildren(el("p", { class: "empty", text: "Nothing added yet." }));
      }

      async function removeLine(lineId) {
        try {
          await api(`/api/carts/${walkin.cartId}/lines/${lineId}`, { method: "DELETE" });
          await refreshWalkin();
        } catch (error) {
          showWalkinError(error.message);
        }
      }

      // ------------------------------------------------------- options sheet
      optsDialog.addEventListener("click", (event) => {
        // The backdrop, same test the customer sheet uses.
        if (event.target === optsDialog) return optsDialog.close();
        const step = event.target.closest("[data-qty]");
        if (!step) return;
        walkin.qty = Math.min(20, Math.max(1, walkin.qty + Number(step.dataset.qty)));
        document.getElementById("opts-qty").textContent = String(walkin.qty);
        priceOptions();
      });
      document.getElementById("opts-close").addEventListener("click", () => optsDialog.close());

      document.getElementById("opts-add").addEventListener("click", async () => {
        const item = walkin.item;
        const quantity = walkin.qty;
        const selections = selectedChoices(optsBody).map(({ groupId, choiceId }) => ({ groupId, choiceId }));
        optsDialog.close();
        await addLine(item, quantity, selections);
      });

      // ------------------------------------------------------------- payment
      const payStaffId = document.getElementById("pay-staff-id");
      const payStaffName = document.getElementById("pay-staff-name");
      const payError = document.getElementById("pay-error");

      createOrder.addEventListener("click", () => {
        document.getElementById("pay-total").textContent = walkin.cart?.total ?? "RM0.00";
        // Blank every time, never remembered: an id already in the box is one
        // tap from putting the last person's name on this person's transaction.
        payStaffId.value = "";
        payStaffName.value = "";
        payError.hidden = true;
        payDialog.showModal();
      });
      document.getElementById("pay-close").addEventListener("click", () => payDialog.close());
      payDialog.addEventListener("click", (event) => {
        if (event.target === payDialog) payDialog.close();
      });

      /**
       * Rings the order up, attributed to whoever is on the till.
       *
       * The sheet stays open until the server has accepted the pair, and the
       * error is shown inside it: a staff code that does not check out is a
       * correction to make right here, not a reason to lose the order and start
       * the whole walk-in again.
       */
      async function place(payment) {
        const staffId = payStaffId.value.trim();
        const staffName = payStaffName.value.trim();
        if (staffId.length === 0 || staffName.length === 0) {
          payError.textContent = "Enter the staff ID and name of whoever is ringing this up.";
          payError.hidden = false;
          return;
        }
        payError.hidden = true;

        try {
          const result = await api("/api/staff/orders/takeaway", {
            method: "POST",
            body: JSON.stringify({ cartId: walkin.cartId, payment, staffId, staffName }),
          });
          payDialog.close();
          createOrder.disabled = true;
          showWalkinError();
          walkinNote.hidden = true;
          const label = `Takeaway #${result.order.takeawayNumber}`;

          // The cart is spent either way; the next walk-in starts from nothing.
          resetWalkin();
          walkin.openCategory = null;
          drawCategories();

          if (payment === "cash") {
            await feed.refresh();
            showError(`${label} is paid and on the pass.`);
            return;
          }

          // Card: it joins the board when the webhook confirms, exactly as a
          // customer's own payment would.
          walkinNote.hidden = false;
          walkinNote.replaceChildren(
            el("strong", { text: `${label} — waiting for payment. ` }),
            document.createTextNode("It joins the live orders when the payment confirms. "),
            result.payment?.checkoutUrl
              ? el("a", {
                  href: result.payment.checkoutUrl,
                  target: "_blank",
                  rel: "noopener",
                  text: "Open the payment page",
                })
              : document.createTextNode("No payment link came back from the provider."),
          );
        } catch (error) {
          // The sheet is still open if the request never got past the server,
          // so the message belongs in it rather than on a banner behind it.
          if (payDialog.open) {
            payError.textContent = error.message;
            payError.hidden = false;
            return;
          }
          showWalkinError(error.message);
          createOrder.disabled = (walkin.cart?.lines?.length ?? 0) === 0;
        }
      }

      document.getElementById("pay-cash").addEventListener("click", () => place("cash"));
      document.getElementById("pay-card").addEventListener("click", () => place("card"));
      clearOrder.addEventListener("click", async () => {
        // Abandoned at the counter. The cart is dropped rather than emptied —
        // the next walk-in opens a fresh one on its first tap.
        resetWalkin();
        showWalkinError();
      });

      async function loadQuickAdd() {
        try {
          const { categories } = await api("/api/menu");
          walkin.menu = categories;
          drawCategories();
        } catch (error) {
          categoriesEl.replaceChildren(el("p", { class: "empty", text: error.message }));
        }
      }

      void loadQuickAdd();

      const feed = orderFeed({
        onData: draw,
        onError: (error) => showError(error.message),
        onState: (state) => {
          feedState.textContent = state === "stale" ? "not updating" : "live";
          feedState.className = state === "stale" ? "feed-state stale" : "feed-state";
        },
      });
    </script>
  </body>
</html>

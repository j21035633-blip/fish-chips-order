<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Dashboard — Anchor &amp; Batter</title>
    <!--
      The staff area is served from its own directory, never through the
      customer's express.static: anything living in that web root is reachable
      at its own filename no matter what path the dashboard is mounted at, which
      would defeat the point of making the path configurable. The shared assets
      below are served under the dashboard's own path for the same reason.

      {{STAFF_BASE}} is substituted at serve time — see renderStaffPage.
    -->
    <link rel="stylesheet" href="{{STAFF_BASE}}/assets/staff.css" />
  </head>
  <body data-staff-base="{{STAFF_BASE}}" data-staff-view="dashboard">
    <p id="error" class="error" hidden></p>

    <main>
      <div class="columns">
        <section><h2 class="column-head"><span>Received</span><span id="count-received">0</span></h2><div id="col-received"></div></section>
        <section><h2 class="column-head"><span>Cooking</span><span id="count-cooking">0</span></h2><div id="col-cooking"></div></section>
        <section><h2 class="column-head"><span>Ready</span><span id="count-ready">0</span></h2><div id="col-ready"></div></section>
      </div>
    </main>

    <script type="module">
      import { api, el, errorBanner, orderFeed } from "{{STAFF_BASE}}/assets/common.js";
      import { mountStaffChrome } from "{{STAFF_BASE}}/assets/nav.js";

      // The board's three columns. `collected` is a status but not a column —
      // an order that has been handed over drops off this view, and the Kitchen
      // & Counter page is where it is marked so.
      const STATUSES = ["received", "cooking", "ready"];
      const NEXT_LABEL = { received: "Start cooking", cooking: "Mark ready" };

      const { slot } = mountStaffChrome({ title: "Kitchen & counter" });
      const feedState = el("span", { id: "feed-state", class: "feed-state", text: "connecting…" });
      const salesTotal = el("div", { class: "sales-total", text: "—" });
      const salesLabel = el("div", { class: "sales-label", text: "Today's sales" });
      slot.append(feedState, el("div", { class: "sales" }, [el("div", {}, [salesTotal, salesLabel])]));

      const showError = errorBanner();
      const busy = new Set();

      function ticket(order) {
        const paid = order.paymentStatus === "paid";
        const next = STATUSES[STATUSES.indexOf(order.kitchenStatus) + 1];
        const previous = STATUSES[STATUSES.indexOf(order.kitchenStatus) - 1];

        return el("article", { class: `ticket ${order.kitchenStatus}` }, [
          el("div", { class: "ticket-head" }, [
            order.tableNumber
              ? el("span", { class: "table", text: `Table ${order.tableNumber}` })
              : el("span", { class: "table takeaway", text: "Counter / takeaway" }),
            el("span", { class: "reference", text: order.reference }),
          ]),
          order.customerName ? el("div", { class: "opts", text: order.customerName }) : null,
          el(
            "ul",
            { class: "lines" },
            order.lines.map((line) =>
              el("li", {}, [
                el("span", {}, [
                  el("span", { text: `${line.quantity}× ${line.name}` }),
                  line.options?.length
                    ? el("div", { class: "opts", text: line.options.map((o) => o.choiceName).join(", ") })
                    : null,
                  line.note ? el("div", { class: "opts", text: `Note: ${line.note}` }) : null,
                ]),
                el("span", { text: line.lineTotal }),
              ]),
            ),
          ),
          el("div", { class: "foot" }, [
            el("span", { class: "total", text: order.total }),
            el("span", { class: `tag ${order.paymentStatus}`, text: paid ? "Paid" : order.paymentStatus }),
            previous
              ? el("button", {
                  class: "undo",
                  type: "button",
                  text: "←",
                  title: `Back to ${previous}`,
                  disabled: busy.has(order.id),
                  onClick: () => move(order.id, previous),
                })
              : null,
            next
              ? el("button", {
                  class: "advance",
                  type: "button",
                  text: NEXT_LABEL[order.kitchenStatus],
                  disabled: busy.has(order.id),
                  onClick: () => move(order.id, next),
                })
              : null,
          ]),
        ]);
      }

      async function move(orderId, status) {
        busy.add(orderId);
        try {
          await api(`/api/staff/orders/${orderId}/status`, {
            method: "PATCH",
            body: JSON.stringify({ status }),
          });
          await feed.refresh();
        } catch (error) {
          showError(error.message);
        } finally {
          busy.delete(orderId);
        }
      }

      function draw({ orders, sales }) {
        showError();
        salesTotal.textContent = sales.total;
        salesLabel.textContent =
          `Today's sales · ${sales.count} order${sales.count === 1 ? "" : "s"} · ${sales.day}`;

        for (const status of STATUSES) {
          const forStatus = orders.filter((order) => order.kitchenStatus === status);
          document.getElementById(`count-${status}`).textContent = String(forStatus.length);
          document
            .getElementById(`col-${status}`)
            .replaceChildren(
              ...(forStatus.length === 0 ? [el("p", { class: "empty", text: "Nothing here." })] : forStatus.map(ticket)),
            );
        }
      }

      const feed = orderFeed({
        onData: draw,
        onError: (error) => showError(error.message),
        onState: (state) => {
          feedState.textContent = state === "stale" ? "not updating" : "live";
          feedState.className = state === "stale" ? "feed-state stale" : "feed-state";
        },
      });
    </script>
  </body>
</html>

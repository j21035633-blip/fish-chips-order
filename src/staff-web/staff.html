<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Kitchen &amp; counter — Anchor &amp; Batter</title>
    <!--
      One self-contained file on purpose. The customer app is served by
      express.static; anything living in that directory is reachable at its own
      filename no matter what path the dashboard is mounted at, which would
      defeat the point of making the path configurable.
    -->
    <style>
      :root {
        --ink: #10241f;
        --ink-soft: #5b6b67;
        --line: #dfe5e3;
        --panel: #fff;
        --bg: #f4f7f6;
        --sea: #12776a;
        --amber: #b06d00;
        --danger: #b3261e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 14px 20px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      h1 { font-size: 17px; margin: 0; }
      .sales {
        margin-left: auto;
        display: flex;
        gap: 18px;
        align-items: baseline;
      }
      .sales-total { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
      .sales-label { font-size: 12px; color: var(--ink-soft); }
      .feed-state { font-size: 12px; color: var(--ink-soft); }
      .feed-state.stale { color: var(--danger); font-weight: 650; }

      main { padding: 18px 20px 60px; }
      .columns { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
      .column-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin: 0 0 10px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ink-soft);
      }

      .ticket {
        background: var(--panel);
        border: 1px solid var(--line);
        border-left: 4px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 10px;
      }
      .ticket.cooking { border-left-color: var(--amber); }
      .ticket.ready { border-left-color: var(--sea); }
      .ticket-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
      .table { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
      .table.takeaway { font-size: 15px; font-weight: 650; color: var(--ink-soft); }
      .reference { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
      .lines { margin: 10px 0 0; padding: 0; list-style: none; font-size: 14px; }
      .lines li { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
      .opts { color: var(--ink-soft); font-size: 12px; }
      .foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
      .total { font-weight: 700; margin-right: auto; }

      .tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.04em; }
      .tag.paid { background: #e3f1ee; color: var(--sea); }
      .tag.pending { background: #fdf1dd; color: var(--amber); }
      .tag.failed, .tag.expired { background: #fbe6e4; color: var(--danger); }

      button { font: inherit; border-radius: 8px; cursor: pointer; }
      .advance { background: var(--sea); color: #fff; border: 0; padding: 9px 14px; font-weight: 650; }
      .advance:disabled { opacity: 0.45; cursor: not-allowed; }
      .undo { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); padding: 8px 10px; font-size: 13px; }
      .empty { color: var(--ink-soft); font-size: 14px; padding: 10px 2px; }
      .error { margin: 0 20px 14px; padding: 10px 12px; border-radius: 8px; background: #fbe6e4; color: var(--danger); font-size: 14px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Kitchen &amp; counter</h1>
      <span id="feed-state" class="feed-state">connecting…</span>
      <div class="sales">
        <div>
          <div id="sales-total" class="sales-total">—</div>
          <div id="sales-label" class="sales-label">Today's sales</div>
        </div>
      </div>
    </header>

    <p id="error" class="error" hidden></p>

    <main>
      <div class="columns">
        <section><h2 class="column-head"><span>Received</span><span id="count-received">0</span></h2><div id="col-received"></div></section>
        <section><h2 class="column-head"><span>Cooking</span><span id="count-cooking">0</span></h2><div id="col-cooking"></div></section>
        <section><h2 class="column-head"><span>Ready</span><span id="count-ready">0</span></h2><div id="col-ready"></div></section>
      </div>
    </main>

    <script>
      // Short polling rather than a websocket: one shop, one process, and a
      // dropped socket on a kitchen tablet that silently stops updating is worse
      // than a request every two seconds. `stale` below makes a stall visible
      // rather than leaving the board quietly frozen.
      const POLL_MS = 2000;
      const STALE_AFTER_MS = 8000;

      const STATUSES = ["received", "cooking", "ready"];
      const NEXT_LABEL = { received: "Start cooking", cooking: "Mark ready" };

      const errorEl = document.getElementById("error");
      const feedState = document.getElementById("feed-state");
      let lastOk = 0;
      let busy = new Set();

      function el(tag, props = {}, children = []) {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(props)) {
          if (value === undefined || value === null || value === false) continue;
          if (key === "class") node.className = value;
          else if (key === "text") node.textContent = value;
          else if (key.startsWith("on")) node.addEventListener(key.slice(2).toLowerCase(), value);
          else node.setAttribute(key, value);
        }
        for (const child of [].concat(children)) {
          if (child === null || child === undefined || child === false) continue;
          node.append(child);
        }
        return node;
      }

      async function api(path, options) {
        const response = await fetch(path, {
          headers: { "content-type": "application/json" },
          ...options,
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.message ?? body.error ?? `Request failed (${response.status})`);
        return body;
      }

      function ticket(order) {
        const paid = order.paymentStatus === "paid";
        const next = STATUSES[STATUSES.indexOf(order.kitchenStatus) + 1];
        const previous = STATUSES[STATUSES.indexOf(order.kitchenStatus) - 1];

        return el("article", { class: `ticket ${order.kitchenStatus}` }, [
          el("div", { class: "ticket-head" }, [
            order.tableNumber
              ? el("span", { class: "table", text: `Table ${order.tableNumber}` })
              : el("span", { class: "table takeaway", text: "Counter / takeaway" }),
            el("span", { class: "reference", text: order.reference }),
          ]),
          order.customerName ? el("div", { class: "opts", text: order.customerName }) : null,
          el(
            "ul",
            { class: "lines" },
            order.lines.map((line) =>
              el("li", {}, [
                el("span", {}, [
                  el("span", { text: `${line.quantity}× ${line.name}` }),
                  line.options?.length
                    ? el("div", { class: "opts", text: line.options.map((o) => o.choiceName).join(", ") })
                    : null,
                  line.note ? el("div", { class: "opts", text: `Note: ${line.note}` }) : null,
                ]),
                el("span", { text: line.lineTotal }),
              ]),
            ),
          ),
          el("div", { class: "foot" }, [
            el("span", { class: "total", text: order.total }),
            el("span", { class: `tag ${order.paymentStatus}`, text: paid ? "Paid" : order.paymentStatus }),
            previous
              ? el("button", {
                  class: "undo",
                  type: "button",
                  text: "←",
                  title: `Back to ${previous}`,
                  disabled: busy.has(order.id),
                  onClick: () => move(order.id, previous),
                })
              : null,
            next
              ? el("button", {
                  class: "advance",
                  type: "button",
                  text: NEXT_LABEL[order.kitchenStatus],
                  disabled: busy.has(order.id),
                  onClick: () => move(order.id, next),
                })
              : null,
          ]),
        ]);
      }

      async function move(orderId, status) {
        busy.add(orderId);
        try {
          await api(`/api/staff/orders/${orderId}/status`, {
            method: "POST",
            body: JSON.stringify({ status }),
          });
          await refresh();
        } catch (error) {
          showError(error.message);
        } finally {
          busy.delete(orderId);
        }
      }

      function showError(message) {
        errorEl.textContent = message;
        errorEl.hidden = false;
      }

      function draw({ orders, sales }) {
        document.getElementById("sales-total").textContent = sales.total;
        document.getElementById("sales-label").textContent =
          `Today's sales · ${sales.count} order${sales.count === 1 ? "" : "s"} · ${sales.day}`;

        for (const status of STATUSES) {
          const forStatus = orders.filter((order) => order.kitchenStatus === status);
          document.getElementById(`count-${status}`).textContent = String(forStatus.length);
          const column = document.getElementById(`col-${status}`);
          column.replaceChildren(
            ...(forStatus.length === 0
              ? [el("p", { class: "empty", text: "Nothing here." })]
              : forStatus.map(ticket)),
          );
        }
      }

      async function refresh() {
        const data = await api("/api/staff/overview");
        lastOk = Date.now();
        errorEl.hidden = true;
        draw(data);
      }

      function tick() {
        refresh().catch((error) => showError(error.message));
        const age = Date.now() - lastOk;
        const stale = lastOk === 0 || age > STALE_AFTER_MS;
        feedState.textContent = stale ? "not updating" : "live";
        feedState.className = stale ? "feed-state stale" : "feed-state";
      }

      tick();
      setInterval(tick, POLL_MS);
    </script>
  </body>
</html>

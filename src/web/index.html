<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Anchor &amp; Batter — Order</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true">&#9875;</span>
          <span class="brand-name">Anchor &amp; Batter</span>
        </a>
        <span id="table-badge" class="table-badge" hidden></span>
      </div>
    </header>

    <main id="view" class="view">
      <p class="loading">Loading the menu…</p>
    </main>

    <!--
      The cart has two states and no third: a slim bar when there is something
      in it, and the sheet below when the bar is tapped. With an empty cart
      neither is rendered — nothing floats over the menu until there is
      something to float.
    -->
    <button
      id="cart-bar"
      class="cart-bar"
      type="button"
      hidden
      aria-haspopup="dialog"
      aria-controls="cart-panel"
      aria-expanded="false"
    >
      <span class="cart-bar-count"><span id="cart-count">0</span> items</span>
      <span class="cart-bar-dot" aria-hidden="true">·</span>
      <span id="cart-bar-total" class="cart-bar-total">RM0.00</span>
      <span class="cart-bar-cta">View order</span>
    </button>

    <aside id="cart-panel" class="cart-panel" hidden role="dialog" aria-modal="true" aria-label="Your order">
      <!-- The drag handle. Also the grab area for swipe-to-close, which is kept
           off the scrolling list so a swipe cannot fight a scroll. -->
      <div id="cart-grip" class="sheet-grip"><span aria-hidden="true"></span></div>
      <div class="sheet-head">
        <h2>Your order</h2>
        <button id="cart-close" class="icon-button" type="button" aria-label="Close">&times;</button>
      </div>
      <div id="cart-body" class="cart-body"></div>
      <div class="cart-foot">
        <!--
          Earning a cast, at the point where someone is looking at their order
          and deciding whether to pay. Hidden until there is a cart to earn on.
        -->
        <div id="earn" class="earn" hidden>
          <div class="earn-head">🎣 Earn a fishing chance</div>
          <div class="earn-row">
            <button id="earn-review" class="earn-button" type="button">Leave a review</button>
            <button id="earn-share" class="earn-button" type="button">Share this</button>
          </div>
          <form id="earn-contact-form" class="earn-row">
            <input
              id="earn-contact"
              class="earn-input"
              type="text"
              inputmode="text"
              autocomplete="tel email"
              placeholder="Phone or email"
              maxlength="120"
            />
            <button id="earn-contact-go" class="earn-button" type="submit">Add</button>
          </form>
          <p id="earn-note" class="earn-note">Spend RM50 and one is added automatically.</p>
        </div>

        <!-- Three lines, not one: a customer who sees RM18.59 for RM16.90 of
             food should find the answer here rather than at the counter. -->
        <div class="totals">
          <div class="totals-row"><span>Subtotal</span><span id="cart-subtotal">RM0.00</span></div>
          <div class="totals-row" id="cart-discount-row" hidden><span id="cart-discount-label">Rewards</span><span id="cart-discount">-RM0.00</span></div>
          <div class="totals-row"><span id="cart-tax-label">Tax</span><span id="cart-tax">RM0.00</span></div>
          <div class="totals-row grand"><span>Total</span><strong id="cart-total">RM0.00</strong></div>
        </div>
        <button id="checkout-button" class="primary wide" type="button" disabled>Checkout</button>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <!--
      The chance indicator. Sits above the cart bar and appears only once there
      is something to say — a customer who has earned nothing is not nagged.
    -->
    <button id="chance-pill" class="chance-pill" type="button" hidden aria-haspopup="dialog">
      <span class="chance-rod" aria-hidden="true">🎣</span>
      <span id="chance-text">1 chance</span>
    </button>

    <!--
      The game. A <dialog> for the same reasons the options sheet is one:
      Escape, a focus trap and an inert page behind it, for free.
    -->
    <dialog id="fish" class="fish-sheet" aria-label="Fishing">
      <div class="sheet-head">
        <h2 id="fish-title">Cast a line</h2>
        <button id="fish-close" class="icon-button" type="button" aria-label="Close">&times;</button>
      </div>

      <div id="fish-stage" class="fish-stage">
        <div class="sea" aria-hidden="true">
          <div id="fish-line" class="line"></div>
          <div id="fish-float" class="float">●</div>
        </div>
        <p id="fish-say" class="fish-say" role="status">Swipe up to cast.</p>
        <!-- The reel's tension. Shown only while reeling. -->
        <div id="fish-tension" class="tension" hidden><div id="fish-tension-fill" class="tension-fill"></div></div>
      </div>

      <div id="fish-prize" class="fish-prize" hidden>
        <div id="fish-prize-tier" class="prize-tier"></div>
        <div id="fish-prize-label" class="prize-label"></div>
        <button id="fish-done" class="primary wide" type="button">Add it to my order</button>
      </div>
    </dialog>

    <!-- The screenshot picker, opened by the review and share buttons. A plain
         file input, so a phone offers its camera roll and its camera. -->
    <input id="proof-file" type="file" accept="image/*" hidden />

    <!--
      Item options. Same sheet as the cart: a grip to swipe, a head with an X,
      and the browser's own modality underneath — a <dialog> gets Escape and a
      focus trap for free, which a hand-rolled overlay would have to reinvent.
    -->
    <dialog id="item-dialog" class="dialog">
      <form method="dialog" id="item-form">
        <div id="item-grip" class="sheet-grip"><span aria-hidden="true"></span></div>
        <div class="sheet-head">
          <h2 id="item-title"></h2>
          <button id="item-close" class="icon-button" type="button" aria-label="Close">&times;</button>
        </div>
        <div id="item-dialog-body"></div>
        <footer class="dialog-foot">
          <!-- A way back to the order without abandoning what is being chosen
               here. Hidden while the cart is empty: there would be nothing to
               look at. -->
          <button type="button" id="item-view-cart" class="view-cart" hidden>View cart (0 items)</button>
          <div class="dialog-actions">
            <div class="qty">
              <button type="button" class="icon-button" data-qty="-1" aria-label="Fewer">&minus;</button>
              <output id="item-qty">1</output>
              <button type="button" class="icon-button" data-qty="1" aria-label="More">+</button>
            </div>
            <button type="button" id="item-add" class="primary">Add — <span id="item-price"></span></button>
          </div>
        </footer>
      </form>
    </dialog>

    <script src="/app.js" type="module"></script>
  </body>
</html>
